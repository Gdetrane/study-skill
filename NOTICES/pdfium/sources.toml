# What is inside the pdfium.wasm that go-pdfium embeds, and so inside
# study-shelf: where each licence text in this folder was copied from, and at
# which revision. Written by hand, as README.md describes. internal/notices
# holds it to go.mod, to the pdfium.wasm in the module cache and to the files
# of this folder, and lists its parts in ../README.md.
format = 1

# The file these notices were written for. A go-pdfium of another version
# fails the test until its pdfium.wasm has been looked at again.
[wasm]
module = "github.com/klippa-app/go-pdfium"
version = "v1.21.3"
file = "internal/pdfium_wasm/pdfium.wasm"
sha256 = "d1dbc423597c0c65cd932cd1bb6a452fdc457a1f3b5009d3d5ec4ca768c47f53"

[[part]]
name = "PDFium"
version = "chromium/8057"
repository = "https://pdfium.googlesource.com/pdfium"
revision = "a5a7089234f121990b336b3841008009dca143bf"

  [[part.file]]
  path = "pdfium/LICENSE"
  source = "LICENSE"
  sha256 = "1fe9dea718fbd75cf149adaf4d8a22a4335604d964ddb76d1b45383dec8668c9"

