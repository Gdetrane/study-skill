name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  core:
    name: Lamplight core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The newest release of the Go line go.mod names. Not go-version-file:
          # go.mod says "go 1.26.0", as its dependencies need it to, and that
          # would be read as that one release, eight security releases back.
          go-version: "1.26.x"
          check-latest: true
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  release:
    # Not a required check: the v2 protection ruleset requires "Lamplight core".
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The newest release of the Go line go.mod names. Not go-version-file:
          # go.mod says "go 1.26.0", as its dependencies need it to, and that
          # would be read as that one release, eight security releases back.
          go-version: "1.26.x"
          check-latest: true
      - name: Check the install script
        run: shellcheck install.sh
      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Build a snapshot without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Check that packages ship both programs, completions, the man page and the licence
        run: |
          set -eu
          archive=dist/lamplight_linux_amd64.tar.gz
          for f in study LICENSE completions/study.bash completions/study.zsh completions/study.fish manpages/study.1.gz; do
            tar tzf "$archive" | grep -qx "$f" || { echo "missing $f in $archive"; exit 1; }
          done
          # study-shelf is built for every platform study is, without cgo.
          for archive in dist/lamplight_linux_amd64.tar.gz dist/lamplight_linux_arm64.tar.gz dist/lamplight_darwin_amd64.tar.gz dist/lamplight_darwin_arm64.tar.gz; do
            for f in study study-shelf; do
              tar tzf "$archive" | grep -qx "$f" || { echo "missing $f in $archive"; exit 1; }
            done
          done
          deb=$(ls dist/lamplight_*_amd64.deb)
          ar p "$deb" data.tar.gz | tar tz | grep -q '^./usr/bin/study$'
          ar p "$deb" data.tar.gz | tar tz | grep -q '^./usr/bin/study-shelf$'
          ar p "$deb" data.tar.gz | tar tz | grep -q '^./usr/share/man/man1/study.1.gz$'
          ar p "$deb" data.tar.gz | tar tz | grep -q '^./usr/share/zsh/vendor-completions/_study$'
          ar p "$deb" data.tar.gz | tar tz | grep -q '^./usr/share/doc/lamplight/copyright$'
          # The rpm has paths of its own for zsh and the licence.
          rpm=$(ls dist/lamplight-*x86_64.rpm)
          command -v rpm >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rpm; }
          for f in /usr/bin/study /usr/bin/study-shelf /usr/share/man/man1/study.1.gz /usr/share/zsh/site-functions/_study /usr/share/licenses/lamplight/LICENSE; do
            rpm -qlp "$rpm" | grep -qx "$f" || { echo "missing $f in $rpm"; exit 1; }
          done
      - name: Check that every archive and package ships the notices of what the programs are built from
        # The NOTICES folder as the repository holds it, which the "Lamplight
        # core" job holds to what the two programs link: every file of it,
        # PDFium's among them, in each archive and no other file beside them,
        # and in the deb and the rpm beside Lamplight's own licence.
        run: |
          set -eu
          tmp=$(mktemp -d)
          find NOTICES -type f | sort > "$tmp/want"
          test -s "$tmp/want"
          grep -qxF NOTICES/pdfium/pdfium/LICENSE "$tmp/want"
          for archive in dist/lamplight_linux_amd64.tar.gz dist/lamplight_linux_arm64.tar.gz dist/lamplight_darwin_amd64.tar.gz dist/lamplight_darwin_arm64.tar.gz; do
            tar tzf "$archive" | grep '^NOTICES/' | grep -v '/$' | sort > "$tmp/got"
            diff "$tmp/want" "$tmp/got" || { echo "$archive does not hold NOTICES as the repository does"; exit 1; }
          done
          for deb in dist/lamplight_*.deb; do
            ar p "$deb" data.tar.gz | tar tz > "$tmp/deb"
            while read -r f; do
              grep -qxF "./usr/share/doc/lamplight/$f" "$tmp/deb" || { echo "missing $f in $deb"; exit 1; }
            done < "$tmp/want"
          done
          for rpm in dist/lamplight-*.rpm; do
            rpm -qlp "$rpm" > "$tmp/rpm"
            while read -r f; do
              grep -qxF "/usr/share/licenses/lamplight/$f" "$tmp/rpm" || { echo "missing $f in $rpm"; exit 1; }
            done < "$tmp/want"
            # The licence the package states is that of what it carries.
            license=$(rpm -qp --queryformat '%{LICENSE}' "$rpm")
            for kind in MIT Apache-2.0 BSD-3-Clause; do
              case " $license " in
              *" $kind "*) ;;
              *) echo "$rpm states the licence \"$license\", which does not name $kind"; exit 1 ;;
              esac
            done
          done
      - name: Install the snapshot with install.sh
        run: |
          set -eu
          home=$(mktemp -d)
          export HOME="$home" SHELL=/bin/bash
          export XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share"
          export XDG_STATE_HOME="$home/.local/state" XDG_CACHE_HOME="$home/.cache"
          STUDY_DOWNLOAD_URL="file://$PWD/dist" sh install.sh
          "$home/.local/bin/study" --version | grep -F snapshot
          "$home/.local/bin/study-shelf" --version | grep -F snapshot
          test -s "$home/.local/share/man/man1/study.1.gz"
          test -s "$home/.local/share/bash-completion/completions/study"
          # The notices were installed whole, and they are of these two
          # programs: every module a released build names has its folder there.
          notices="$home/.local/share/doc/lamplight/NOTICES"
          diff -r NOTICES "$notices"
          for program in study study-shelf; do
            go version -m "$home/.local/bin/$program" | awk '$1 == "dep" { print $2 }' > "$home/deps"
            test -s "$home/deps"
            while read -r module; do
              test -d "$notices/modules/$module" || { echo "the released $program holds $module, which has no notice"; exit 1; }
            done < "$home/deps"
          done
          # study links nothing of Shelf's (ADR-0012), in the release's builds too.
          if go version -m "$home/.local/bin/study" | grep -E 'modernc.org/sqlite|go-pdfium|wazero|go-readability'; then
            echo "the released study links what only study-shelf may"; exit 1
          fi
          go version -m "$home/.local/bin/study-shelf" | grep -q 'modernc.org/sqlite'
          # The two that were installed work together: study starts study-shelf
          # as it starts any plugin, and they speak the contract.
          export STUDY_HOME="$home/study" PATH="$home/.local/bin:$PATH"
          study knowledge-base add shelf -- study-shelf
          study knowledge-base check shelf
          echo "INSTALLED_SHELF=$home/.local/bin/study-shelf" >> "$GITHUB_ENV"
      - name: The released study-shelf keeps the contract, with PDFs
        # The conformance suite against the program a learner would install,
        # not one built for the test: it reads PDFs, which compiles the PDF
        # reader to this processor's machine code.
        run: LAMPLIGHT_TEST_SHELF="$INSTALLED_SHELF" go test ./internal/shelf -run '^TestShelfConformsAsStudyStartsIt$' -count=1
      - name: Keep the archives for the other platforms
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-archives
          path: |
            dist/lamplight_*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  platforms:
    # Not a required check either. A snapshot is built on Linux for every
    # platform; this job is the one place its programs for macOS, and for
    # Linux on arm64, are run, and the one place Shelf's tests run there: the
    # PDF reader is compiled to the processor's machine code when Shelf first
    # reads a PDF, which no other system can stand in for. The programs for
    # macOS on Intel are built and never run.
    name: Shelf and the snapshot on ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            shell: /bin/zsh
          - name: Linux on arm64
            os: ubuntu-24.04-arm
            shell: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # As above.
          go-version: "1.26.x"
          check-latest: true
      - name: Test Shelf
        run: go test ./internal/shelf/... ./cmd/study-shelf
      - name: Fetch the archives
        uses: actions/download-artifact@v4
        with:
          name: snapshot-archives
          path: dist
      - name: Install the snapshot with install.sh
        run: |
          set -eu
          home=$(mktemp -d)
          export HOME="$home" SHELL=${{ matrix.shell }}
          export XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share"
          export XDG_STATE_HOME="$home/.local/state" XDG_CACHE_HOME="$home/.cache"
          STUDY_DOWNLOAD_URL="file://$PWD/dist" sh install.sh
          "$home/.local/bin/study" --version | grep -F snapshot
          "$home/.local/bin/study-shelf" --version | grep -F snapshot
          # As above: the notices, whole, and of what this system's two
          # programs hold, which is more on macOS than on Linux.
          notices="$home/.local/share/doc/lamplight/NOTICES"
          diff -r NOTICES "$notices"
          for program in study study-shelf; do
            go version -m "$home/.local/bin/$program" | awk '$1 == "dep" { print $2 }' > "$home/deps"
            test -s "$home/deps"
            while read -r module; do
              test -d "$notices/modules/$module" || { echo "the released $program holds $module, which has no notice"; exit 1; }
            done < "$home/deps"
          done
          export STUDY_HOME="$home/study" PATH="$home/.local/bin:$PATH"
          study knowledge-base add shelf -- study-shelf
          study knowledge-base check shelf
          echo "INSTALLED_SHELF=$home/.local/bin/study-shelf" >> "$GITHUB_ENV"
      - name: The released study-shelf keeps the contract, with PDFs
        run: LAMPLIGHT_TEST_SHELF="$INSTALLED_SHELF" go test ./internal/shelf -run '^TestShelfConformsAsStudyStartsIt$' -count=1
