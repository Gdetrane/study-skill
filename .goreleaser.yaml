# GoReleaser configuration for Lamplight's `study` binary (ADR-0010).
# docs/release.md explains how to cut a release. The GitHub release is the
# only place a release is published, so it needs no secret of our own.
version: 2

project_name: lamplight

before:
  hooks:
    - go mod download
    # Shell completions and the man page, shipped in every package.
    - ./scripts/release-assets.sh

builds:
  - id: study
    main: ./cmd/study
    binary: study
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mordor-forge/lamplight/v2/internal/cli.Version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    # No version in the name: install.sh downloads the newest archive from
    # releases/latest/download/<name> without having to ask which release
    # that is.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt

snapshot:
  # Snapshots are never releases; the v1 tags in this repository must not
  # make them look like one.
  version_template: "0.0.0-snapshot+{{ .ShortCommit }}"

changelog:
  use: github-native

release:
  prerelease: auto

nfpms:
  - id: packages
    package_name: lamplight
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/mordor-forge/lamplight
    description: "Lamplight: see where you are in your studies, and what to do next"
    license: MIT
    maintainer: Gdetrane <Gdetrane@users.noreply.github.com>
    vendor: mordor-forge
    formats: [deb, rpm]
    bindir: /usr/bin
    section: utils
    contents:
      - src: completions/study.bash
        dst: /usr/share/bash-completion/completions/study
        file_info:
          mode: 0644
      # Debian's zsh reads vendor completions from vendor-completions;
      # Fedora's and others' from site-functions.
      - src: completions/study.zsh
        dst: /usr/share/zsh/vendor-completions/_study
        packager: deb
        file_info:
          mode: 0644
      - src: completions/study.zsh
        dst: /usr/share/zsh/site-functions/_study
        packager: rpm
        file_info:
          mode: 0644
      - src: completions/study.fish
        dst: /usr/share/fish/vendor_completions.d/study.fish
        file_info:
          mode: 0644
      - src: manpages/study.1.gz
        dst: /usr/share/man/man1/study.1.gz
        file_info:
          mode: 0644
      # Debian keeps a package's licence in its doc folder, as "copyright";
      # Fedora and others keep it under /usr/share/licenses.
      - src: LICENSE
        dst: /usr/share/doc/lamplight/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/lamplight/LICENSE
        packager: rpm
        file_info:
          mode: 0644
